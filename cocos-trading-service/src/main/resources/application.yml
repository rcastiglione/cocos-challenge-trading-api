server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cocos-trading-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
