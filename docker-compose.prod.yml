services:
  redis:
    image: redis:7-alpine
    container_name: cocos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cocos-network

  cocos-trading-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cocos-trading-api
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://ep-dark-cloud-be97dqg9-pooler.c-9.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_VGl0rgp7skIR
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    stop_grace_period: 1s
    networks:
      - cocos-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cocos-prometheus
    depends_on:
      - cocos-trading-api
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - cocos-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cocos-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - cocos-network

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  cocos-network:
    driver: bridge

