services:
  cocos-postgres:
    image: postgres:16-alpine
    container_name: cocos-postgres
    environment:
      POSTGRES_DB: cocos_trading
      POSTGRES_USER: cocos_user
      POSTGRES_PASSWORD: cocos_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocos_user -d cocos_trading"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cocos-network

  cocos-trading-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cocos-trading-api
    depends_on:
      cocos-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: cocos-postgres
      DB_PORT: 5432
      DB_NAME: cocos_trading
      DB_USERNAME: cocos_user
      DB_PASSWORD: cocos_password
    ports:
      - "8080:8080"
    stop_grace_period: 1s
    networks:
      - cocos-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cocos-prometheus
    depends_on:
      - cocos-trading-api
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - cocos-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cocos-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - cocos-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  cocos-network:
    driver: bridge
